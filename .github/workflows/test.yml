name: Test Build

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: '打包 macOS（dmg，aarch64 + x86_64）'
        required: false
        default: true
        type: boolean
      build_windows:
        description: '打包 Windows（msi，x86_64）'
        required: false
        default: true
        type: boolean
      build_linux:
        description: '打包 Linux（deb，x86_64 + aarch64）'
        required: false
        default: true
        type: boolean
      build_appimage:
        description: '打包 Linux AppImage'
        required: false
        default: true
        type: boolean
      build_android:
        description: '打包 Android（apk）'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: '所有平台启用 debug 构建（调试/免签名直装）'
        required: false
        default: true
        type: boolean
      build_ios:
        description: '打包 iOS（无签名构建）'
        required: false
        default: false
        type: boolean
      build_docker:
        description: '构建 Docker 镜像（仅构建，不推送）'
        required: false
        default: false
        type: boolean

env:
  EASYTIER_CORE_VERSION: v2.6.4

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. 下载各平台 easytier-core 归档（供打包时内嵌）
  # ---------------------------------------------------------------
  fetch-easytier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download easytier-core archives
        run: |
          set -e
          mkdir -p src-tauri/resources/bin
          for p in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64; do
            url="https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_CORE_VERSION}/easytier-${p}-${EASYTIER_CORE_VERSION}.zip"
            echo "downloading ${p} from ${url}"
            curl -fL --retry 3 -o "src-tauri/resources/bin/easytier-${p}-${EASYTIER_CORE_VERSION}.zip" "${url}"
          done
          ls -la src-tauri/resources/bin/

      - name: Upload per-platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-linux-x86_64
          path: src-tauri/resources/bin/easytier-linux-x86_64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 7
      - name: Upload per-platform artifacts (linux-aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-linux-aarch64
          path: src-tauri/resources/bin/easytier-linux-aarch64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 7
      - name: Upload per-platform artifacts (macos-x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-macos-x86_64
          path: src-tauri/resources/bin/easytier-macos-x86_64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 7
      - name: Upload per-platform artifacts (macos-aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-macos-aarch64
          path: src-tauri/resources/bin/easytier-macos-aarch64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 7
      - name: Upload per-platform artifacts (windows-x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-windows-x86_64
          path: src-tauri/resources/bin/easytier-windows-x86_64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. 桌面端打包（手动触发按平台开关选择）
  # ---------------------------------------------------------------
  build-desktop-macos:
    needs: fetch-easytier
    if: inputs.build_macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: homeTier-aarch64.dmg
            bin: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: homeTier-x86_64.dmg
            bin: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin-${{ matrix.bin }}
          path: src-tauri/resources/bin/

      - name: Install macOS deps
        run: brew install protobuf

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} ${{ inputs.debug_mode && '--debug' || '' }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -maxdepth 5 -name "*.dmg" -exec cp {} dist/ \;
          echo "Staged macOS artifacts:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-desktop-windows:
    needs: fetch-easytier
    if: inputs.build_windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
            artifact: homeTier-x86_64.msi
            bin: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin-${{ matrix.bin }}
          path: src-tauri/resources/bin/

      - name: Set up MSVC development environment (vcvars64)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows deps
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Install WinPcap dev pack (Packet.lib for pnet crate)
        shell: pwsh
        run: |
          $url = "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip"
          $out = "$env:TEMP/WpdPack.zip"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Expand-Archive -Path $out -DestinationPath "C:/WpdPack" -Force
          $libPath = "C:/WpdPack/WpdPack/Lib/x64"
          echo "LIB=$libPath;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=C:/WpdPack/WpdPack/Include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "[winpcap] Packet.lib at $libPath"

      - name: Verify Npcap + Wintun runtime DLLs are bundled
        shell: pwsh
        run: |
          # Real packet.dll/wpcap.dll/wintun.dll/WinDivert64.sys are committed to
          # src-tauri/resources/bin. wintun.dll is required by easytier-core.exe to
          # create the virtual NIC on Windows; without it tun::create() fails and
          # has_virtual_ip stays false.
          $dlls = @("packet.dll", "wpcap.dll", "wintun.dll", "WinDivert64.sys")
          foreach ($dll in $dlls) {
            $target = "$env:GITHUB_WORKSPACE/src-tauri/resources/bin/$dll"
            $len = (Get-Item $target).Length
            if ($len -lt 10000) {
              Write-Error "$dll is NOT a valid DLL (size=$len)"
              exit 1
            }
            Write-Host "$dll OK ($len bytes)"
          }
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
      - name: Configure MSVC include path (for vcruntime.h used by kcp-sys bindgen)
        shell: pwsh
        run: |
          $msvcRoot = "C:/Program Files/Microsoft Visual Studio"
          if (Test-Path $msvcRoot) {
            $msvcDirs = Get-ChildItem -Path "$msvcRoot/*/*/VC/Tools/MSVC/*/include" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending
            if ($msvcDirs.Count -gt 0) {
              $msvcInclude = $msvcDirs[0].FullName
              echo "INCLUDE=$msvcInclude;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              echo "[msvc-include] Found: $msvcInclude"
            } else {
              echo "[msvc-include] WARNING: No MSVC include directory found"
            }
          } else {
            echo "[msvc-include] WARNING: MSVC root not found at $msvcRoot"
          }
      - name: Configure WinDivert (compile from vendored source)
        shell: bash
        run: |
          echo "WINDIVERT_STATIC=1" >> "$GITHUB_ENV"
          echo "[windivert] Using vendored source build (WINDIVERT_STATIC=1)"
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --verbose ${{ inputs.debug_mode && '--debug' || '' }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -maxdepth 5 -name "*.msi" -exec cp {} dist/ \;
          echo "Staged Windows artifacts:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 7

  build-desktop-linux:
    needs: fetch-easytier
    if: inputs.build_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact: homeTier-x86_64.deb
            bin: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
            artifact: homeTier-aarch64.deb
            bin: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin-${{ matrix.bin }}
          path: src-tauri/resources/bin/

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y libssl-dev libxdo-dev protobuf-compiler

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} ${{ inputs.debug_mode && '--debug' || '' }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -maxdepth 5 -name "*.deb" -exec cp {} dist/ \;
          echo "Staged Linux artifacts:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------
  # 3. Linux AppImage
  # ---------------------------------------------------------------
  build-appimage:
    needs: fetch-easytier
    if: inputs.build_appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin-linux-x86_64
          path: src-tauri/resources/bin/
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev protobuf-compiler
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm tauri build --bundles appimage ${{ inputs.debug_mode && '--debug' || '' }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -maxdepth 5 -name "*.AppImage" -exec cp {} dist/ \;
          echo "Staged AppImage artifacts:"
          ls -lh dist/
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: homeTier.AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------
  # 4. Android APK
  # ---------------------------------------------------------------
  build-android:
    if: inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-aarch64
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android/m2repository
          sudo rm -rf /opt/hostedtoolcache/Go /opt/hostedtoolcache/Python
          df -h / | tail -1
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk: 25.2.9519653
      - name: Set up Android Keystore
        run: |
          mkdir -p src-tauri/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > src-tauri/keystore/release.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore src-tauri/keystore/release.keystore \
              -alias hometier -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass hometier123 -keypass hometier123 \
              -dname "CN=homeTier CI, OU=CI, O=homeTier, L=CI, ST=CI, C=CN" 2>/dev/null
            echo "KEYSTORE_PASSWORD=hometier123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=hometier123" >> $GITHUB_ENV
            echo "[keystore] 未配置 secrets，已生成一次性自签名 keystore（hometier123）"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev
      - name: Configure bindgen for Android NDK
        shell: bash
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/*$::')"
          fi
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "[bindgen] NDK sysroot: $SYSROOT"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Init Android project
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
      - name: Fix MainActivity for Tauri 2.x
        run: bash scripts/fix-android-mainactivity.sh
      - name: Fix Kotlin version for JDK 17 compatibility
        run: |
          sed -i 's/classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1\.6\.21")/classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")/' src-tauri/gen/android/build.gradle.kts
      - name: Configure Android signing
        run: bash scripts/fix-android-build-gradle.sh
      - name: Limit Gradle parallelism
        run: |
          printf '\norg.gradle.workers.max=2\norg.gradle.jvmargs=-Xmx2048m\n' >> src-tauri/gen/android/gradle.properties
      - name: Inject camera permissions
        run: bash scripts/mobile-permissions.sh
      - name: Verify Android injection
        run: bash scripts/verify-android-injection.sh
      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64 --target armv7 ${{ inputs.debug_mode && '--debug' || '' }}
      - name: Verify APK contents (native libs per ABI)
        run: |
          APK=$(find src-tauri/gen/android -maxdepth 8 -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "ERROR: no APK produced"; exit 1; fi
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a)/.*\.so" || { echo "ERROR: no native libs found in APK"; exit 1; }
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/gen/android -maxdepth 8 -name "*.apk" -exec cp {} dist/ \;
          echo "Staged Android artifacts:"
          ls -lh dist/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homeTier-android.apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------
  # 5. iOS（无签名构建，需 macOS runner）
  # ---------------------------------------------------------------
  build-ios:
    if: inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Init iOS project
        run: pnpm tauri ios init
      - name: Inject camera permissions
        run: bash scripts/mobile-permissions.sh
      - name: Install protoc
        run: brew install protobuf
      - name: Install mod_pbxproj for Xcode project injection
        run: pip3 install mod-pbxproj
      - name: Build easytier-ios-staticlib for iOS
        run: |
          cd src-tauri
          cargo build --target aarch64-apple-ios --manifest-path easytier-ios-staticlib/Cargo.toml ${{ !inputs.debug_mode && '--release' || '' }}
      - name: Inject NetworkExtension target into Xcode project
        run: |
          python3 src-tauri/gen-scripts/ios/inject_ne_target.py \
            src-tauri/gen/apple/HomeTier.xcodeproj \
            src-tauri/gen-scripts/ios
      - name: Build iOS with NetworkExtension (no sign)
        run: |
          xcodebuild -project src-tauri/gen/apple/HomeTier.xcodeproj \
            -scheme HomeTier \
            -configuration ${{ inputs.debug_mode && 'Debug' || 'Release' }} \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: homeTier-ios
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------
  # 6. Docker 镜像（仅构建，不推送）
  # ---------------------------------------------------------------
  build-docker:
    needs: fetch-easytier
    if: inputs.build_docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin-linux-x86_64
          path: src-tauri/resources/bin/
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hometier:test
          build-args: |
            EASYTIER_CORE_VERSION=${{ env.EASYTIER_CORE_VERSION }}
