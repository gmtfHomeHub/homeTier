name: Release

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: '打包 macOS（dmg，aarch64 + x86_64）'
        required: false
        default: true
        type: boolean
      build_windows:
        description: '打包 Windows（msi，x86_64）'
        required: false
        default: true
        type: boolean
      build_linux:
        description: '打包 Linux（deb，x86_64 + aarch64）'
        required: false
        default: true
        type: boolean
      build_appimage:
        description: '打包 Linux AppImage'
        required: false
        default: true
        type: boolean
      build_android:
        description: '打包 Android（apk）'
        required: false
        default: true
        type: boolean
      build_ios:
        description: '打包 iOS（无签名构建，未完成平台隔离，默认跳过）'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

# 控制 EasyTier core 版本（requirements: 用单个环境变量统一管理）
env:
  EASYTIER_CORE_VERSION: v2.6.4

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. 下载各平台 easytier-core 归档到 resources/bin/（供打包时内嵌）
  #    归档命名与 downloader::detect_platform() 保持一致，仅下载存在的资产。
  # ---------------------------------------------------------------
  fetch-easytier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download easytier-core archives
        run: |
          set -e
          mkdir -p src-tauri/resources/bin
          for p in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64; do
            url="https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_CORE_VERSION}/easytier-${p}-${EASYTIER_CORE_VERSION}.zip"
            echo "downloading ${p} from ${url}"
            curl -fL --retry 3 -o "src-tauri/resources/bin/easytier-${p}-${EASYTIER_CORE_VERSION}.zip" "${url}"
          done
          ls -la src-tauri/resources/bin/

      - name: Verify checksums (sha256 from GitHub Release API)
        run: |
          set -e
          curl -s "https://api.github.com/repos/EasyTier/EasyTier/releases/tags/${EASYTIER_CORE_VERSION}" -o /tmp/easytier-release.json
          for f in src-tauri/resources/bin/*.zip; do
            name=$(basename "$f")
            expected=$(jq -r --arg n "$name" '.assets[] | select(.name==$n) | .digest' /tmp/easytier-release.json | sed 's/sha256://')
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "CHECKSUM MISMATCH: $name"; exit 1
            fi
            echo "verified: $name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: easytier-bin
          path: src-tauri/resources/bin/
          retention-days: 1

  # ---------------------------------------------------------------
  # 2. 桌面端打包（tag 发布全量打包；手动触发按平台开关选择）
  # ---------------------------------------------------------------
  build-desktop-macos:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: homeTier-aarch64.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: homeTier-x86_64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin
          path: src-tauri/resources/bin/

      - name: Install macOS deps
        run: brew install protobuf

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Locate artifacts
        id: locate
        shell: bash
        run: |
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*
            src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: warn

  build-desktop-windows:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
            artifact: homeTier-x86_64.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin
          path: src-tauri/resources/bin/

      # 关键修复：运行 vcvars64 并导出完整的 MSVC 环境（INCLUDE/LIB/PATH）。
      # bindgen（kcp-sys）用 clang 编译 wrapper.h，clang 在 MSVC 目标下只要读到
      # INCLUDE 环境变量就不会再自动探测 VS 工具链——而 runner 镜像自带的 INCLUDE
      # 只有 Windows SDK（ucrt/shared/um），缺少 VC\Tools\MSVC\<ver>\include，
      # 导致找不到 vcruntime.h。这一步把环境补齐到与本地 Developer PowerShell 一致。
      - name: Set up MSVC development environment (vcvars64)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows deps
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Install WinPcap dev pack (Packet.lib for pnet crate)
        shell: pwsh
        run: |
          $url = "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip"
          $out = "$env:TEMP/WpdPack.zip"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Expand-Archive -Path $out -DestinationPath "C:/WpdPack" -Force
          # x64 lib: C:/WpdPack/WpdPack/Lib/x64/Packet.lib
          # Add to LIB so linker finds Packet.lib
          $libPath = "C:/WpdPack/WpdPack/Lib/x64"
          echo "LIB=$libPath;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=C:/WpdPack/WpdPack/Include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "[winpcap] Packet.lib at $libPath"

      - name: Configure MSVC include path (for vcruntime.h used by kcp-sys bindgen)
        shell: pwsh
        run: |
          # Find MSVC include directory (contains vcruntime.h needed by ucrt/corecrt.h)
          # Standard location: C:\Program Files\Microsoft Visual Studio\<VS>\<edition>\VC\Tools\MSVC\<ver>\include
          $msvcRoot = "C:/Program Files/Microsoft Visual Studio"
          if (Test-Path $msvcRoot) {
            $msvcDirs = Get-ChildItem -Path "$msvcRoot/*/*/VC/Tools/MSVC/*/include" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending
            if ($msvcDirs.Count -gt 0) {
              $msvcInclude = $msvcDirs[0].FullName
              echo "INCLUDE=$msvcInclude;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              echo "[msvc-include] Found: $msvcInclude"
            } else {
              echo "[msvc-include] WARNING: No MSVC include directory found"
            }
          } else {
            echo "[msvc-include] WARNING: MSVC root not found at $msvcRoot"
          }

      - name: Configure WinDivert (compile from vendored source)
        shell: bash
        run: |
          # The windivert-rust crate (used by easytier) has a "static" feature that
          # compiles WinDivert from the vendored source (vendor/dll/windivert.c)
          # instead of linking a pre-built binary. Setting WINDIVERT_STATIC=1
          # activates this path, avoiding broken external download URLs.
          echo "WINDIVERT_STATIC=1" >> "$GITHUB_ENV"
          echo "[windivert] Using vendored source build (WINDIVERT_STATIC=1)"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Locate artifacts
        id: locate
        shell: bash
        run: |
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*
            src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: warn

  build-desktop-linux:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact: homeTier-x86_64.deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
            artifact: homeTier-aarch64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin
          path: src-tauri/resources/bin/

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y libssl-dev libxdo-dev protobuf-compiler

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Locate artifacts
        id: locate
        shell: bash
        run: |
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*
            src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 3. Linux AppImage
  # ---------------------------------------------------------------
  build-appimage:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin
          path: src-tauri/resources/bin/
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev protobuf-compiler
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm tauri build --bundles appimage
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: homeTier.AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 4. Android APK
  # ---------------------------------------------------------------
  build-android:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin
          path: src-tauri/resources/bin/
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android/m2repository
          df -h / | tail -1
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk: 25.2.9519653
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev
      - name: Configure bindgen for Android NDK
        shell: bash
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/*$::')"
          fi
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "[bindgen] NDK sysroot: $SYSROOT"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Init Android project
        run: pnpm tauri android init
      - name: Limit Gradle parallelism
        run: |
          printf '\norg.gradle.workers.max=2\norg.gradle.jvmargs=-Xmx2048m\n' >> src-tauri/gen/android/gradle.properties
      - name: Inject camera permissions
        run: bash scripts/mobile-permissions.sh
      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homeTier-android.apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 5. iOS (无签名构建，需 macOS runner)
  # ---------------------------------------------------------------
  build-ios:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin
          path: src-tauri/resources/bin/
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Init iOS project
        run: pnpm tauri ios init
      - name: Inject camera permissions
        run: bash scripts/mobile-permissions.sh
      - name: Install protoc
        run: brew install protobuf
      - name: Build iOS (no sign)
        run: pnpm tauri ios build --no-sign
      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: homeTier-ios
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 6. Docker 镜像（仅 tag 触发，随版本发布）
  # ---------------------------------------------------------------
  build-docker:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin
          path: src-tauri/resources/bin/
      - name: Compute lowercase image repo
        id: repo
        run: echo "image_repo=ghcr.io/$(echo ${{ github.repository }} | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo.outputs.image_repo }}:latest
            ${{ steps.repo.outputs.image_repo }}:${{ github.ref_name }}
          build-args: |
            EASYTIER_CORE_VERSION=${{ env.EASYTIER_CORE_VERSION }}

  # ---------------------------------------------------------------
  # 7. 汇总发布到 GitHub Release（仅 tag 触发）
  # ---------------------------------------------------------------
  release:
    needs: [build-desktop-macos, build-desktop-windows, build-desktop-linux, build-appimage, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts && sha256sum * > checksums.txt && cat checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**