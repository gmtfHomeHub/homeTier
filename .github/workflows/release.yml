name: Release

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: '打包 macOS（dmg，aarch64 + x86_64）'
        required: false
        default: true
        type: boolean
      build_windows:
        description: '打包 Windows（msi，x86_64 + arm64）'
        required: false
        default: true
        type: boolean
      build_linux:
        description: '打包 Linux（deb，x86_64 + aarch64）'
        required: false
        default: true
        type: boolean
      build_appimage:
        description: '打包 Linux AppImage'
        required: false
        default: true
        type: boolean
      build_android:
        description: '打包 Android（apk）'
        required: false
        default: false
        type: boolean
      build_ios:
        description: '打包 iOS（无签名构建，未完成平台隔离，默认跳过）'
        required: false
        default: false
        type: boolean
      build_docker:
        description: '构建 Docker 镜像并推送到 GHCR'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: '所有平台启用 debug 构建（调试/免签名直装；false=release 正式构建）'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

# 控制 EasyTier core 版本（requirements: 用单个环境变量统一管理）
env:
  EASYTIER_CORE_VERSION: v2.6.4

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. 下载各平台 easytier-core 归档到 resources/bin/（供打包时内嵌）
  #    归档命名与 downloader::detect_platform() 保持一致，仅下载存在的资产。
  # ---------------------------------------------------------------
  fetch-easytier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download easytier-core archives
        run: |
          set -e
          mkdir -p src-tauri/resources/bin
          for p in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-arm64; do
            url="https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_CORE_VERSION}/easytier-${p}-${EASYTIER_CORE_VERSION}.zip"
            echo "downloading ${p} from ${url}"
            curl -fL --retry 3 -o "src-tauri/resources/bin/easytier-${p}-${EASYTIER_CORE_VERSION}.zip" "${url}"
          done
          ls -la src-tauri/resources/bin/

      - name: Verify checksums (sha256 from GitHub Release API)
        run: |
          set -e
          curl -s "https://api.github.com/repos/EasyTier/EasyTier/releases/tags/${EASYTIER_CORE_VERSION}" -o /tmp/easytier-release.json
          for f in src-tauri/resources/bin/*.zip; do
            name=$(basename "$f")
            expected=$(jq -r --arg n "$name" '.assets[] | select(.name==$n) | .digest' /tmp/easytier-release.json | sed 's/sha256://')
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "CHECKSUM MISMATCH: $name"; exit 1
            fi
            echo "verified: $name"
          done

      - name: Trim easytier archives (keep only easytier-core)
        run: |
          set -e
          # Only easytier-core.exe is used at runtime; easytier-web.exe / easytier-cli.exe /
          # easytier-web-embed.exe are never referenced in the codebase. Removing them cuts
          # each archive roughly in half, shrinking the MSI/APK bundle.
          # wintun.dll / WinDivert64.sys come from resources/bin (git), NOT from the zip.
          for p in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-arm64; do
            zip="src-tauri/resources/bin/easytier-${p}-${EASYTIER_CORE_VERSION}.zip"
            if [ ! -f "$zip" ]; then
              echo "SKIP: $zip not found"
              continue
            fi
            orig_size=$(stat -c%s "$zip" 2>/dev/null || stat -f%z "$zip")
            tmpdir=$(mktemp -d)
            unzip -q -o "$zip" -d "$tmpdir"
            find "$tmpdir" -type f ! -name "easytier-core*" -delete
            rm "$zip"
            (cd "$tmpdir" && zip -q -r "$OLDPWD/$zip" .)
            rm -rf "$tmpdir"
            new_size=$(stat -c%s "$zip" 2>/dev/null || stat -f%z "$zip")
            saved=$(( (orig_size - new_size) * 100 / orig_size ))
            echo "Trimmed ${p}: ${orig_size} -> ${new_size} bytes (-${saved}%)"
          done
          echo "--- After trim ---"
          ls -la src-tauri/resources/bin/

      # 每个平台归档单独上传：各打包 job 只取本平台文件，
      # 避免把 5 个平台的 easytier-core（合计约 142MB）全部打进同一个安装包
      - name: Upload per-platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-linux-x86_64
          path: src-tauri/resources/bin/easytier-linux-x86_64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 1
      - name: Upload per-platform artifacts (linux-aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-linux-aarch64
          path: src-tauri/resources/bin/easytier-linux-aarch64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 1
      - name: Upload per-platform artifacts (macos-x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-macos-x86_64
          path: src-tauri/resources/bin/easytier-macos-x86_64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 1
      - name: Upload per-platform artifacts (macos-aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-macos-aarch64
          path: src-tauri/resources/bin/easytier-macos-aarch64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 1
      - name: Upload per-platform artifacts (windows-x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-windows-x86_64
          path: src-tauri/resources/bin/easytier-windows-x86_64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 1
      - name: Upload per-platform artifacts (windows-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: easytier-bin-windows-arm64
          path: src-tauri/resources/bin/easytier-windows-arm64-${{ env.EASYTIER_CORE_VERSION }}.zip
          retention-days: 1

  # ---------------------------------------------------------------
  # 2. 桌面端打包（tag 发布全量打包；手动触发按平台开关选择）
  #    各 job 仅下载并嵌入本平台的 easytier-core 归档
  # ---------------------------------------------------------------
  build-desktop-macos:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: homeTier-aarch64.dmg
            bin: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: homeTier-x86_64.dmg
            bin: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ./.github/actions/setup-build
        with:
          rust-targets: ${{ matrix.target }}
          cache-key: macos-${{ matrix.bin }}
          easytier-artifact: easytier-bin-${{ matrix.bin }}

      - name: Install macOS deps
        run: brew install protobuf

      - name: Build Tauri bundle
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} ${{ inputs.debug_mode && '--debug' || '' }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -maxdepth 5 -name "*.dmg" -exec cp {} dist/ \;
          echo "Staged macOS artifacts:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.dmg
          if-no-files-found: error

  build-desktop-windows:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
            artifact: homeTier-x86_64.msi
            bin: windows-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: msi
            artifact: homeTier-arm64.msi
            bin: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ./.github/actions/setup-build
        with:
          rust-targets: ${{ matrix.target }}
          cache-key: windows-${{ matrix.bin }}
          easytier-artifact: easytier-bin-${{ matrix.bin }}

      # 关键修复：运行 vcvars64 并导出完整的 MSVC 环境（INCLUDE/LIB/PATH）。
      # bindgen（kcp-sys）用 clang 编译 wrapper.h，clang 在 MSVC 目标下只要读到
      # INCLUDE 环境变量就不会再自动探测 VS 工具链——而 runner 镜像自带的 INCLUDE
      # 只有 Windows SDK（ucrt/shared/um），缺少 VC\Tools\MSVC\<ver>\include，
      # 导致找不到 vcruntime.h。这一步把环境补齐到与本地 Developer PowerShell 一致。
      - name: Set up MSVC development environment (vcvars64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}

      - name: Install protoc
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Install WinPcap dev pack (x64 Packet.lib for pnet crate)
        if: matrix.target != 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          # x64: WinPcap/WpdPack 提供 Lib/x64/Packet.lib
          $url = "https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip"
          $out = "$env:TEMP/WpdPack.zip"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Expand-Archive -Path $out -DestinationPath "C:/WpdPack" -Force
          $libPath = "C:/WpdPack/WpdPack/Lib/x64"
          echo "LIB=$libPath;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=C:/WpdPack/WpdPack/Include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "[winpcap] Packet.lib at $libPath"

      - name: Install Npcap SDK ARM64 lib (Packet.lib + wpcap.lib for pnet crate)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          # ARM64: WinPcap/WpdPack 无 ARM64 lib；改用 Npcap SDK 1.16 的 Lib/ARM64
          $url = "https://npcap.com/dist/npcap-sdk-1.16.zip"
          $out = "$env:TEMP/npcap-sdk.zip"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Expand-Archive -Path $out -DestinationPath "C:/NpcapSDK" -Force
          $libPath = "C:/NpcapSDK/Lib/ARM64"
          echo "LIB=$libPath;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=C:/NpcapSDK/Include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "[npcap-sdk] ARM64 Packet.lib + wpcap.lib at $libPath"

      - name: Verify runtime DLLs are bundled
        shell: pwsh
        run: |
          # x64: packet.dll/wpcap.dll/wintun.dll/WinDivert64.sys 在 resources/bin
          # ARM64: wintun.dll/packet.dll 在 resources/bin/aarch64
          # (easytier ARM64 不使用 WinDivert，wpcap.dll 非必需)
          if ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") {
            $dlls = @("aarch64/wintun.dll", "aarch64/packet.dll")
          } else {
            $dlls = @("packet.dll", "wpcap.dll", "wintun.dll", "WinDivert64.sys")
          }
          foreach ($dll in $dlls) {
            $target = "$env:GITHUB_WORKSPACE/src-tauri/resources/bin/$dll"
            $len = (Get-Item $target).Length
            if ($len -lt 10000) {
              Write-Error "$dll is NOT a valid DLL (size=$len)"
              exit 1
            }
            Write-Host "$dll OK ($len bytes)"
          }
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Configure MSVC include path (for vcruntime.h used by kcp-sys bindgen)
        shell: pwsh
        run: |
          $msvcRoot = "C:/Program Files/Microsoft Visual Studio"
          if (Test-Path $msvcRoot) {
            $msvcDirs = Get-ChildItem -Path "$msvcRoot/*/*/VC/Tools/MSVC/*/include" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending
            if ($msvcDirs.Count -gt 0) {
              $msvcInclude = $msvcDirs[0].FullName
              echo "INCLUDE=$msvcInclude;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              echo "[msvc-include] Found: $msvcInclude"
            } else {
              echo "[msvc-include] WARNING: No MSVC include directory found"
            }
          } else {
            echo "[msvc-include] WARNING: MSVC root not found at $msvcRoot"
          }

      - name: Configure WinDivert (x64 only, compile from vendored source)
        if: matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          # ARM64: easytier cfg_select 限定 windivert 仅 x86_64/x86 编译，无需配置
          echo "WINDIVERT_STATIC=1" >> "$GITHUB_ENV"
          echo "[windivert] Using vendored source build (WINDIVERT_STATIC=1)"

      - name: Build Tauri bundle
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --verbose ${{ inputs.debug_mode && '--debug' || '' }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -maxdepth 5 -name "*.msi" -exec cp {} dist/ \;
          echo "Staged Windows artifacts:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.msi
          if-no-files-found: error

  build-desktop-linux:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact: homeTier-x86_64.deb
            bin: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
            artifact: homeTier-aarch64.deb
            bin: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ./.github/actions/setup-build
        with:
          rust-targets: ${{ matrix.target }}
          cache-key: linux-${{ matrix.bin }}
          easytier-artifact: easytier-bin-${{ matrix.bin }}
          linux-deps: 'true'

      - name: Build Tauri bundle
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} ${{ inputs.debug_mode && '--debug' || '' }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -maxdepth 5 -name "*.deb" -exec cp {} dist/ \;
          echo "Staged Linux artifacts:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 3. Linux AppImage
  # ---------------------------------------------------------------
  build-appimage:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_appimage
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-build
        with:
          cache-key: appimage
          easytier-artifact: easytier-bin-linux-x86_64
          linux-deps: 'true'

      - name: Build
        run: pnpm tauri build --bundles appimage ${{ inputs.debug_mode && '--debug' || '' }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -maxdepth 5 -name "*.AppImage" -exec cp {} dist/ \;
          echo "Staged AppImage artifacts:"
          ls -lh dist/
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: homeTier.AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 4. Android APK
  # ---------------------------------------------------------------
  build-android:
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          cache-key: android-multi-arch

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android/m2repository
          sudo rm -rf /opt/hostedtoolcache/Go /opt/hostedtoolcache/Python
          df -h / | tail -1
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk: 25.2.9519653
      - name: Set up Android Keystore
        run: |
          mkdir -p src-tauri/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # 从 GitHub Secrets 创建 keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > src-tauri/keystore/release.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            # 未配置 secrets 时生成一次性自签名 keystore，保证 APK 始终可签名构建
            keytool -genkeypair -v -keystore src-tauri/keystore/release.keystore \
              -alias hometier -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass hometier123 -keypass hometier123 \
              -dname "CN=homeTier CI, OU=CI, O=homeTier, L=CI, ST=CI, C=CN" 2>/dev/null
            echo "KEYSTORE_PASSWORD=hometier123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=hometier123" >> $GITHUB_ENV
            echo "[keystore] 未配置 secrets，已生成一次性自签名 keystore（hometier123）"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev
      - name: Configure bindgen for Android NDK
        shell: bash
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/*$::')"
          fi
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
          echo "[bindgen] NDK sysroot: $SYSROOT"
      - name: Init Android project
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
      - name: Fix MainActivity for Tauri 2.x
        run: bash scripts/fix-android-mainactivity.sh
      - name: Fix Kotlin version for JDK 17 compatibility
        run: |
          # Kotlin 1.6.21 doesn't support JDK 17; upgrade to 1.9.22
          sed -i 's/classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1\.6\.21")/classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")/' src-tauri/gen/android/build.gradle.kts
      - name: Configure Android signing
        run: bash scripts/fix-android-build-gradle.sh
      - name: Limit Gradle parallelism
        run: |
          printf '\norg.gradle.workers.max=2\norg.gradle.jvmargs=-Xmx2048m\n' >> src-tauri/gen/android/gradle.properties
      - name: Inject camera permissions
        run: bash scripts/mobile-permissions.sh
      - name: Verify Android injection
        run: bash scripts/verify-android-injection.sh
      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64 --target armv7 --target i686 --target x86_64 ${{ inputs.debug_mode && '--debug' || '' }}
      - name: Verify APK contents (native libs per ABI)
        run: |
          APK=$(find src-tauri/gen/android -maxdepth 8 -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "ERROR: no APK produced"; exit 1; fi
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/.*\.so" || { echo "ERROR: no native libs found in APK"; exit 1; }
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/gen/android -maxdepth 8 -name "*.apk" -exec cp {} dist/ \;
          echo "Staged Android artifacts:"
          ls -lh dist/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homeTier-android.apk
          path: dist/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 5. iOS (无签名构建，需 macOS runner) - 仅手动触发，tag 发布不自动构建
  # ---------------------------------------------------------------
  build-ios:
    if: inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-apple-ios
          cache-key: ios

      - name: Init iOS project
        run: pnpm tauri ios init
      - name: Inject camera permissions
        run: bash scripts/mobile-permissions.sh
      - name: Install protoc
        run: brew install protobuf
      - name: Install mod_pbxproj for Xcode project injection
        run: pip3 install mod-pbxproj
      - name: Build easytier-ios-staticlib for iOS
        run: |
          cd src-tauri
          cargo build --target aarch64-apple-ios --manifest-path easytier-ios-staticlib/Cargo.toml ${{ !inputs.debug_mode && '--release' || '' }}
      - name: Inject NetworkExtension target into Xcode project
        run: |
          python3 src-tauri/gen-scripts/ios/inject_ne_target.py \
            src-tauri/gen/apple/HomeTier.xcodeproj \
            src-tauri/gen-scripts/ios
      - name: Build iOS with NetworkExtension (no sign)
        run: |
          xcodebuild -project src-tauri/gen/apple/HomeTier.xcodeproj \
            -scheme HomeTier \
            -configuration ${{ inputs.debug_mode && 'Debug' || 'Release' }} \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: homeTier-ios
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 6. Docker 镜像（tag 发布 或 手动触发）
  # ---------------------------------------------------------------
  build-docker:
    needs: fetch-easytier
    if: startsWith(github.ref, 'refs/tags/') || inputs.build_docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: easytier-bin-linux-x86_64
          path: src-tauri/resources/bin/
      - name: Compute lowercase image repo
        id: repo
        run: echo "image_repo=ghcr.io/$(echo ${{ github.repository }} | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ steps.repo.outputs.image_repo }}:latest
            ${{ steps.repo.outputs.image_repo }}:${{ github.ref_name }}
          build-args: |
            EASYTIER_CORE_VERSION=${{ env.EASYTIER_CORE_VERSION }}

  # ---------------------------------------------------------------
  # 7. 汇总发布到 GitHub Release（仅 tag 触发）
  # ---------------------------------------------------------------
  release:
    needs: [build-desktop-macos, build-desktop-windows, build-desktop-linux, build-appimage, build-android, build-docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: homeTier-*
          merge-multiple: true
      - name: Collect release files
        run: |
          mkdir -p release_files
          find artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" \
            -o -name "*.AppImage" -o -name "*.apk" \) \
            -exec cp {} release_files/ \;
          echo "Release files:"
          ls -lh release_files/
      - name: Generate checksums
        run: |
          cd release_files && sha256sum * > checksums.txt && cat checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release_files/*