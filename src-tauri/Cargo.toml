[package]
name = "homeTier"
version = "0.1.0"
description = "A cross-platform virtual LAN application based on EasyTier"
authors = ["you"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "home_tier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
dashmap = "6"
directories = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
qrcode = "0.14"
image = "0.25"
zstd = "0.13"
cidr = "0.3"
url = { version = "2", features = ["serde"] }
gethostname = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
aes-gcm = "0.10"
rand = "0.8"

# HTTP 代理服务
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
urlencoding = "2"
regex = "1"
encoding_rs = "0.8"
async-trait = "0.1"

# EasyTier (本地引用)
easytier = { path = "../third_libs/easytier/easytier", features = [
    "wireguard",
    "websocket",
    "tun",
    "socks5",
    "kcp",
    "quic",
    "zstd",
] }

# WebRTC
webrtc = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_IO",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework-sys = "2.9"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Mobile-specific dependencies will be added as needed

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
