[package]
name = "easytier-ios-staticlib"
version = "0.1.0"
edition = "2021"
description = "iOS staticlib for homeTier NetworkExtension FFI"
publish = false

[lib]
name = "easytier_ios_staticlib"
crate-type = ["staticlib"]

[dependencies]
easytier = { path = "../resources/easytier_lib/easytier", features = ["wireguard", "websocket", "tun", "socks5", "kcp", "quic", "zstd", "macos-ne"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
thiserror = "1.0"

# iOS-specific logging
#[cfg(target_os = "ios")]
tracing-oslog = "0.3"

# For App Group file access
#[cfg(target_os = "ios")]
directories = "5.0"

# For shared state
parking_lot = "0.12"