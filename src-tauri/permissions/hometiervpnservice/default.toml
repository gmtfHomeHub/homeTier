"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-prepare_vpn"
description = "Enables the prepare_vpn command — requests OS VPN authorization."
commands.allow = ["prepare_vpn"]

[[permission]]
identifier = "allow-start_vpn"
description = "Enables the start_vpn command — starts the VpnService."
commands.allow = ["start_vpn"]

[[permission]]
identifier = "allow-stop_vpn"
description = "Enables the stop_vpn command — stops the VpnService."
commands.allow = ["stop_vpn"]

[[permission]]
identifier = "allow-get_vpn_status"
description = "Enables the get_vpn_status command — queries VPN status."
commands.allow = ["get_vpn_status"]

[[permission]]
identifier = "allow-request_screen_capture"
description = "Enables the request_screen_capture command — requests MediaProjection permission."
commands.allow = ["request_screen_capture"]

[[permission]]
identifier = "allow-request_mic_permission"
description = "Enables the request_mic_permission command — requests microphone permission."
commands.allow = ["request_mic_permission"]

[[permission]]
identifier = "allow-request_camera_permission"
description = "Enables the request_camera_permission command — requests camera permission."
commands.allow = ["request_camera_permission"]

[[permission]]
identifier = "allow-start_screen_share"
description = "Enables the start_screen_share command — starts screen sharing."
commands.allow = ["start_screen_share"]

[[permission]]
identifier = "allow-stop_screen_share"
description = "Enables the stop_screen_share command — stops screen sharing."
commands.allow = ["stop_screen_share"]

[[permission]]
identifier = "allow-set_screen_share_quality"
description = "Enables the set_screen_share_quality command — adjusts screen share quality."
commands.allow = ["set_screen_share_quality"]

[default]
description = """
All Mobile VPN / screen-sharing / permission commands enabled by default on mobile platforms.
Desktop platforms ignore this plugin (not compiled).
"""
permissions = [
  "allow-prepare_vpn",
  "allow-start_vpn",
  "allow-stop_vpn",
  "allow-get_vpn_status",
  "allow-request_screen_capture",
  "allow-request_mic_permission",
  "allow-request_camera_permission",
  "allow-start_screen_share",
  "allow-stop_screen_share",
  "allow-set_screen_share_quality",
]
