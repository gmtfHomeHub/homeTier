<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景径向渐变：从中心深蓝到边缘浅灰白 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>

    <!-- 图标投影阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 白色圆角主背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bgGrad)" />

  <!-- 外围 P2P 网络节点（营造分布式网络氛围） -->
  <g opacity="0.3">
    <circle cx="180" cy="300" r="12" fill="#1E40AF" />
    <circle cx="844" cy="300" r="12" fill="#1E40AF" />
    <circle cx="180" cy="700" r="12" fill="#1E40AF" />
    <circle cx="844" cy="700" r="12" fill="#1E40AF" />
    <circle cx="300" cy="160" r="8" fill="#1E40AF" />
    <circle cx="724" cy="160" r="8" fill="#1E40AF" />
    <circle cx="300" cy="864" r="8" fill="#1E40AF" />
    <circle cx="724" cy="864" r="8" fill="#1E40AF" />
    <line x1="180" y1="300" x2="300" y2="160" stroke="#1E40AF" stroke-width="2" stroke-dasharray="6,6" />
    <line x1="724" y1="160" x2="844" y2="300" stroke="#1E40AF" stroke-width="2" stroke-dasharray="6,6" />
    <line x1="180" y1="700" x2="300" y2="864" stroke="#1E40AF" stroke-width="2" stroke-dasharray="6,6" />
    <line x1="724" y1="864" x2="844" y2="700" stroke="#1E40AF" stroke-width="2" stroke-dasharray="6,6" />
  </g>

  <!-- 烟囱与数据包（代表 P2P 数据传输） -->
  <g>
    <rect x="680" y="220" width="44" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />
    <rect x="670" y="210" width="64" height="18" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />
    <circle cx="702" cy="180" r="14" fill="#E2E8F0" opacity="0.5" />
    <circle cx="718" cy="145" r="18" fill="#E2E8F0" opacity="0.35" />
    <circle cx="710" cy="105" r="22" fill="#E2E8F0" opacity="0.2" />
  </g>

  <!-- 房子主体（屋顶与墙体分离） -->
  <!-- 屋顶（上移） -->
  <g filter="url(#shadow)">
    <path d="M 220,400 Q 512,100 804,400 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- 墙体（下移，与屋顶留出空隙） -->
  <g filter="url(#shadow)">
    <rect x="292" y="440" width="440" height="380" rx="40" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
  </g>

  <!-- 内部 P2P 网络节点（倒三角布局，与门保持均匀间距） -->
  <g>
    <!-- 节点连接线 -->
    <line x1="448" y1="499" x2="576" y2="499" stroke="#1E40AF" stroke-width="12" stroke-linecap="round" />
    <line x1="448" y1="499" x2="512" y2="609" stroke="#1E40AF" stroke-width="12" stroke-linecap="round" />
    <line x1="576" y1="499" x2="512" y2="609" stroke="#1E40AF" stroke-width="12" stroke-linecap="round" />

    <!-- 节点圆环 -->
    <circle cx="448" cy="499" r="36" fill="#1E40AF" />
    <circle cx="576" cy="499" r="36" fill="#1E40AF" />
    <circle cx="512" cy="609" r="36" fill="#1E40AF" />

    <!-- 节点中心点（代表设备） -->
    <circle cx="448" cy="499" r="14" fill="#FFFFFF" />
    <circle cx="576" cy="499" r="14" fill="#FFFFFF" />
    <circle cx="512" cy="609" r="14" fill="#FFFFFF" />
  </g>

  <!-- 智能门（家庭入口，比例放大，位置调整以匹配间距） -->
  <g>
    <rect x="457" y="668" width="110" height="130" rx="16" fill="#1E40AF" />
    <!-- 门把手 -->
    <circle cx="548" cy="718" r="10" fill="#FFFFFF" />
    <!-- 门上装饰（小网络节点） -->
    <circle cx="512" cy="690" r="6" fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>