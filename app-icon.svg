<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <!-- 房子主体渐变 -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <!-- 屋顶渐变 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <!-- 门渐变 -->
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bgGrad)" />

  <!-- 装饰性圆点背景 -->
  <circle cx="150" cy="150" r="60" fill="#FFFFFF" opacity="0.08" />
  <circle cx="874" cy="150" r="80" fill="#FFFFFF" opacity="0.06" />
  <circle cx="150" cy="874" r="70" fill="#FFFFFF" opacity="0.07" />
  <circle cx="874" cy="874" r="50" fill="#FFFFFF" opacity="0.09" />
  <circle cx="512" cy="100" r="40" fill="#FFFFFF" opacity="0.05" />
  <circle cx="512" cy="924" r="45" fill="#FFFFFF" opacity="0.06" />

  <!-- 房子主体（带阴影） -->
  <g filter="url(#shadow)">
    <!-- 房子主体 - 矩形 -->
    <rect x="224" y="400" width="576" height="424" rx="24" ry="24" fill="url(#houseGrad)" />

    <!-- 屋顶 - 三角形 -->
    <polygon points="512,180 160,420 864,420" fill="url(#roofGrad)" />

    <!-- 屋顶装饰线 -->
    <polygon points="512,200 200,418 824,418" fill="none" stroke="#FBBF24" stroke-width="4" opacity="0.4" />
  </g>

  <!-- 烟囱 -->
  <rect x="680" y="240" width="80" height="140" rx="12" ry="12" fill="#D97706" />
  <rect x="672" y="230" width="96" height="24" rx="8" ry="8" fill="#B45309" />

  <!-- 烟 -->
  <circle cx="720" cy="200" r="16" fill="#FFFFFF" opacity="0.3" />
  <circle cx="740" cy="170" r="20" fill="#FFFFFF" opacity="0.2" />
  <circle cx="730" cy="135" r="24" fill="#FFFFFF" opacity="0.12" />

  <!-- 窗户 - 左 -->
  <g filter="url(#innerShadow)">
    <rect x="280" y="490" width="130" height="130" rx="16" ry="16" fill="#DBEAFE" />
    <rect x="280" y="490" width="130" height="130" rx="16" ry="16" fill="none" stroke="#C7D2FE" stroke-width="4" />
    <!-- 窗框十字 -->
    <line x1="345" y1="490" x2="345" y2="620" stroke="#C7D2FE" stroke-width="4" />
    <line x1="280" y1="555" x2="410" y2="555" stroke="#C7D2FE" stroke-width="4" />
    <!-- 窗框 -->
    <rect x="280" y="490" width="130" height="130" rx="16" ry="16" fill="none" stroke="#A5B4FC" stroke-width="8" />
  </g>

  <!-- 窗户 - 右 -->
  <g filter="url(#innerShadow)">
    <rect x="614" y="490" width="130" height="130" rx="16" ry="16" fill="#DBEAFE" />
    <rect x="614" y="490" width="130" height="130" rx="16" ry="16" fill="none" stroke="#C7D2FE" stroke-width="4" />
    <!-- 窗框十字 -->
    <line x1="679" y1="490" x2="679" y2="620" stroke="#C7D2FE" stroke-width="4" />
    <line x1="614" y1="555" x2="744" y2="555" stroke="#C7D2FE" stroke-width="4" />
    <!-- 窗框 -->
    <rect x="614" y="490" width="130" height="130" rx="16" ry="16" fill="none" stroke="#A5B4FC" stroke-width="8" />
  </g>

  <!-- 门 -->
  <g filter="url(#innerShadow)">
    <rect x="437" y="580" width="150" height="244" rx="20" ry="20" fill="url(#doorGrad)" />
    <!-- 门框 -->
    <rect x="437" y="580" width="150" height="244" rx="20" ry="20" fill="none" stroke="#B45309" stroke-width="8" />
    <!-- 门把手 -->
    <circle cx="555" cy="710" r="14" fill="#FEF3C7" />
    <circle cx="555" cy="710" r="8" fill="#F59E0B" />
    <!-- 门上装饰线 -->
    <line x1="512" y1="580" x2="512" y2="824" stroke="#B45309" stroke-width="4" opacity="0.3" />
    <!-- 门上方拱形 -->
    <path d="M437,600 Q512,540 587,600" fill="none" stroke="#B45309" stroke-width="6" opacity="0.4" />
  </g>

  <!-- 门垫 -->
  <rect x="457" y="818" width="110" height="20" rx="6" ry="6" fill="#78350F" opacity="0.4" />

  <!-- 房子底部阴影 -->
  <ellipse cx="512" cy="840" rx="300" ry="20" fill="#000000" opacity="0.08" />

  <!-- 底部文字 "HomeTier" -->
  <text x="512" y="940" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" opacity="0.9">HomeTier</text>

  <!-- 文字下方小装饰线 -->
  <line x1="380" y1="960" x2="644" y2="960" stroke="#FFFFFF" stroke-width="2" opacity="0.3" stroke-linecap="round" />
</svg>